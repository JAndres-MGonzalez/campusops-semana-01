# Generated by engineering-professor. This workflow is formative feedback.
# Final grading repeats critical checks in an instructor-controlled runner.
name: Week 06 Academic Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Public Expo Android build
        run: npm run bundle:release
      - name: AC-01 — reproducibility
        run: make verify-week-06
      - name: Session concurrency and lifecycle
        run: npm test -- --ci --runInBand course-tests/public/week-06.test.ts src/infrastructure/session/session.test.ts evidence/week-06/concurrency.test.ts evidence/week-06/auth-cases.test.ts evidence/week-06/session-app.test.tsx
      - name: AC-02 — public behavior
        run: make public-test-week-06
      - name: AC-03 — declared failure evidence
        if: github.ref == 'refs/tags/week-06-final'
        run: |
          git fetch --no-tags --depth=2 origin tag week-06-final
          make evidence-week-06
      - name: Upload academic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-week-06-sesion-segura
          if-no-files-found: warn
          path: |
            reports/week-06/**
            evidence/week-06/**
